name: Wake Mission AI scheduler
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake existing Mission AI Free service
        run: >-
          curl --fail --silent --show-error
          --connect-timeout 15 --max-time 120
          --output /dev/null
          https://mission-ai-chat-test-mckee.onrender.com/
